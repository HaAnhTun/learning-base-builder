<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<style>
:root {
  --bg: #fff; --card: #fff; --fg: #1c1d1f; --muted: #6a6f73; --line: #d1d7dc;
  --accent: #a435f0; --ok: #1e6b3a; --ok-bg: #e6f4ea; --bad: #b32d0f; --bad-bg: #fdecea;
  --flag: #b4690e; --btn: #1c1d1f; --btn-fg: #fff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1d1f; --card: #26272a; --fg: #f7f9fa; --muted: #9da2a6; --line: #3e4143;
    --accent: #c77dff; --ok: #7ddc9a; --ok-bg: #1d3326; --bad: #ff9b88; --bad-bg: #3a2420;
    --flag: #f0b45a; --btn: #f7f9fa; --btn-fg: #1c1d1f;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
#app { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
h2 { font-size: 1.15rem; margin: 24px 0 8px; }
.muted { color: var(--muted); font-size: .9rem; }
button { font: inherit; cursor: pointer; }
.btn { background: var(--btn); color: var(--btn-fg); border: 1px solid var(--btn); padding: 10px 18px; font-weight: 700; border-radius: 2px; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--fg); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.link { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 0; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.progress { height: 6px; background: var(--line); border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); padding: 16px 20px; margin-bottom: 12px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.btns { display: flex; gap: 8px; flex-shrink: 0; }
.badge { font-size: .75rem; font-weight: 700; padding: 2px 8px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); }
.badge.ok { color: var(--ok); border-color: var(--ok); }
.badge.bad { color: var(--bad); border-color: var(--bad); }
.picker { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
.picker label { cursor: pointer; }
.picker input { display: none; }
.q { font-size: 1.05rem; margin: 8px 0 16px; }
.q p, .opt p, .fb p { margin: 0 0 .6em; }
.q p:last-child, .opt p:last-child, .fb p:last-child { margin: 0; }
pre { background: rgba(127,127,127,.15); padding: 10px; overflow-x: auto; }
code { font-family: ui-monospace, Consolas, monospace; font-size: .9em; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
.opt:hover { border-color: var(--fg); }
.opt.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); box-shadow: inset 0 0 0 1px var(--ok); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); box-shadow: inset 0 0 0 1px var(--bad); }
.opt input { margin-top: 5px; accent-color: var(--accent); }
.opt .txt { flex: 1; }
.opt .tag { display: block; font-size: .8rem; margin-bottom: 2px; }
.opt.ok .tag { color: var(--ok); }
.opt.bad .tag { color: var(--bad); }
.opts > div { margin-bottom: 8px; }
.fb { font-size: .92rem; color: var(--muted); padding: 8px 14px 4px 40px; }
.expl { margin-top: 12px; padding: 12px 14px; border-left: 3px solid var(--accent); background: rgba(127,127,127,.1); font-size: .92rem; }
.banner { font-weight: 700; margin: 0 0 12px; }
.banner.ok { color: var(--ok); }
.banner.bad { color: var(--bad); }
.actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.actions > div { display: flex; gap: 8px; flex-wrap: wrap; }
.nav { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; }
.nav button { width: 38px; height: 38px; border: 1px solid var(--line); background: var(--card); color: var(--fg); position: relative; }
.nav button.done { background: var(--fg); color: var(--bg); }
.nav button.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.nav button.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.nav button.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
#app.wide { max-width: 1080px; }
.layout { display: grid; grid-template-columns: 224px minmax(0, 1fr); gap: 24px; align-items: start; }
.side { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding: 3px; }
.side .nav { margin-top: 0; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; max-height: none; order: 2; }
}
.nav button.flag::after { content: ""; position: absolute; top: 2px; right: 2px; border: 5px solid transparent; border-top-color: var(--flag); border-right-color: var(--flag); }
.flagbtn.on { color: var(--flag); }
.score { text-align: center; padding: 24px 0; }
.score .pct { font-size: 3rem; font-weight: 700; line-height: 1.1; }
.tabs { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
.tabs button { background: none; border: 1px solid var(--line); color: var(--fg); padding: 4px 12px; border-radius: 14px; }
.tabs button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
td, th { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const app = document.getElementById('app');
const S = { quizzes: [], course: '', cur: null };
let timer = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Question HTML comes from Udemy; keep markup but drop anything executable.
function clean(html) {
  const t = document.createElement('template');
  t.innerHTML = html || '';
  t.content.querySelectorAll('script,style,iframe,object,embed,link,meta,base,form').forEach(e => e.remove());
  t.content.querySelectorAll('*').forEach(e => {
    for (const a of [...e.attributes]) {
      if (/^on/i.test(a.name) || /^\s*javascript:/i.test(a.value)) e.removeAttribute(a.name);
    }
    // Doc links must not navigate away from a quiz in progress.
    if (e.tagName === 'A') { e.target = '_blank'; e.rel = 'noopener noreferrer'; }
  });
  return t.innerHTML;
}

const fmtTime = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const setEq = (a, b) => a.size === b.size && [...a].every(x => b.has(x));

// ---- loading ----
async function load(files) {
  let failed = 0;
  for (const f of files) {
    if (!f.name.endsWith('.json')) continue;
    try {
      const d = JSON.parse(await f.text());
      if (f.name === '_quizzes.json') S.course = d.title || '';
      else if (Array.isArray(d.assessments)) S.quizzes.push(d);
    } catch { failed++; }
  }
  S.quizzes.sort((a, b) => (a.position ?? 0) - (b.position ?? 0));
  S.failed = failed;
  home();
}

function toQuestions(quiz) {
  return quiz.assessments.map(a => ({
    html: a.prompt.question,
    answers: a.prompt.answers,
    fb: a.prompt.feedbacks || [],
    expl: a.prompt.explanation || '',
    section: a.section || '',
    correct: new Set(a.correct_response.map(c => c.charCodeAt(0) - 97)),
  }));
}

// ---- home ----
function home() {
  clearInterval(timer);
  S.cur = null;
  app.className = '';
  const picker = `<div class="picker">
    <label class="btn">Chọn thư mục quizzes<input type="file" id="dir" webkitdirectory></label>
    <label class="btn ghost">Chọn file .json<input type="file" id="files" accept=".json" multiple></label>
  </div>`;
  if (!S.quizzes.length) {
    app.innerHTML = `<h1>Quiz</h1>
      <p class="muted">Chọn thư mục <code>data/input/&lt;slug&gt;/quizzes</code> (do <code>python -m engine fetch</code> tải về) để bắt đầu. Dữ liệu chỉ đọc trong trình duyệt, không gửi đi đâu.</p>
      ${picker}${S.failed ? `<p class="muted">${S.failed} file lỗi JSON, đã bỏ qua.</p>` : ''}`;
    bindPickers();
    return;
  }
  let lastCh = null, html = '';
  for (const q of S.quizzes) {
    if (q.chapter_title !== lastCh) {
      lastCh = q.chapter_title;
      html += `<h2>${esc(q.chapter_index != null ? q.chapter_index + '. ' : '')}${esc(q.chapter_title || '')}</h2>`;
    }
    html += `<div class="card row">
      <div><strong>${esc(q.title)}</strong>
        <div class="muted">${q.assessments.length} câu · điểm đạt ${q.pass_percent ?? '?'}%${q.type === 'practice-test' ? ' · <span class="badge">Practice test</span>' : ''}</div></div>
      <div class="btns">
        <button class="btn" data-act="start" data-id="${q.quiz_id}" data-instant="1">Luyện tập</button>
        <button class="btn ghost" data-act="start" data-id="${q.quiz_id}">${q.type === 'practice-test' ? 'Thi thử' : 'Làm bài'}</button>
      </div>
    </div>`;
  }
  app.innerHTML = `<h1>${esc(S.course || 'Quiz')}</h1>
    <p class="muted">${S.quizzes.length} quiz · ${S.quizzes.reduce((n, q) => n + q.assessments.length, 0)} câu hỏi</p>
    ${picker}${html}`;
  bindPickers();
}

function bindPickers() {
  for (const id of ['dir', 'files']) {
    const el = document.getElementById(id);
    el.onchange = () => { S.quizzes = []; S.course = ''; load(el.files); };
  }
}

// ---- quiz ----
// instant=true: practice mode, the answer is revealed as soon as one is picked (any quiz type).
function start(id, instant = false) {
  const quiz = S.quizzes.find(q => q.quiz_id == id);
  const qs = toQuestions(quiz);
  S.cur = {
    quiz, qs, i: 0, instant, exam: quiz.type === 'practice-test' && !instant,
    picked: qs.map(() => new Set()), checked: qs.map(() => false), flagged: qs.map(() => false),
    t0: Date.now(), done: false, filter: 'all',
  };
  clearInterval(timer);
  if (S.cur.exam) timer = setInterval(() => {
    const el = document.getElementById('timer');
    if (el) el.textContent = fmtTime(Math.round((Date.now() - S.cur.t0) / 1000));
  }, 1000);
  render();
}

// One question; reveal=true marks correct/wrong answers and shows the feedback.
function questionHtml(i, reveal) {
  const c = S.cur, q = c.qs[i], multi = q.correct.size > 1;
  const opts = q.answers.map((a, k) => {
    const sel = c.picked[i].has(k), ok = q.correct.has(k);
    const cls = ['opt', sel && 'sel', reveal && ok && 'ok', reveal && !ok && sel && 'bad'].filter(Boolean).join(' ');
    const tag = reveal && ok ? '<b class="tag">Đáp án đúng</b>' : reveal && sel ? '<b class="tag">Đáp án sai</b>' : '';
    return `<div><label class="${cls}">
        <input type="${multi ? 'checkbox' : 'radio'}" name="pick" data-k="${k}" ${sel ? 'checked' : ''} ${reveal ? 'disabled' : ''}>
        <span class="txt">${tag}${clean(a)}</span></label>
        ${reveal && q.fb[k] ? `<div class="fb">${clean(q.fb[k])}</div>` : ''}</div>`;
  }).join('');
  return `<div class="q">${clean(q.html)}</div>${multi && !reveal ? '<p class="muted">Chọn tất cả đáp án đúng.</p>' : ''}
    <div class="opts">${opts}</div>
    ${reveal && q.expl ? `<div class="expl"><strong>Giải thích</strong><br>${clean(q.expl)}</div>` : ''}`;
}

const isRight = i => setEq(S.cur.picked[i], S.cur.qs[i].correct);

function render() {
  const c = S.cur;
  if (c.done) return results();
  const i = c.i, n = c.qs.length, reveal = !c.exam && c.checked[i];
  const last = i === n - 1;
  // Practice mode jumps freely, so leaving the last question goes through finish (unanswered count).
  const fwd = c.instant && last ? 'finish' : 'next';
  const done = c.checked.filter(Boolean).length;
  const focusK = document.activeElement?.dataset?.k;
  const banner = reveal
    ? `<div class="banner ${isRight(i) ? 'ok' : 'bad'}">${isRight(i) ? 'Chính xác!' : 'Chưa đúng'}</div>` : '';
  const navBtns = c.qs.map((_, k) => {
    const st = c.instant && c.checked[k] ? (isRight(k) ? 'ok' : 'bad') : c.picked[k].size ? 'done' : '';
    return `<button data-act="go" data-i="${k}" class="${[st, c.flagged[k] && 'flag', k === i && 'cur'].filter(Boolean).join(' ')}">${k + 1}</button>`;
  }).join('');
  const actions = c.exam
    ? `<div><button class="btn ghost" data-act="prev" ${i === 0 ? 'disabled' : ''}>Câu trước</button>
        <button class="btn ghost" data-act="next" ${last ? 'disabled' : ''}>Câu sau</button></div>
       <button class="btn" data-act="finish">Nộp bài</button>`
    : `<div>${c.instant && i > 0 ? '<button class="btn ghost" data-act="prev">Câu trước</button>' : ''}
        ${c.checked[i] ? '' : `<button class="btn ghost" data-act="${fwd}">Bỏ qua</button>`}</div>
       ${c.checked[i]
         ? `<button class="btn" data-act="${fwd}">${last ? 'Xem kết quả' : 'Câu tiếp theo'}</button>`
         : c.instant && c.qs[i].correct.size === 1 ? ''
         : `<button class="btn" data-act="check" ${c.picked[i].size ? '' : 'disabled'}>Kiểm tra đáp án</button>`}`;
  const main = `<div class="card">
      ${c.exam ? `<div style="text-align:right"><button class="link flagbtn ${c.flagged[i] ? 'on' : ''}" data-act="flag">${c.flagged[i] ? '⚑ Bỏ đánh dấu' : '⚐ Đánh dấu xem lại'}</button></div>` : ''}
      ${banner}${questionHtml(i, reveal)}
    </div>
    <div class="actions">${actions}</div>`;
  const side = `<aside class="side"><div class="nav">${navBtns}</div>
      <p class="muted">Đã làm ${done}/${n}<br><span class="badge ok">Đúng</span> <span class="badge bad">Sai</span></p>
      <button class="btn ghost" data-act="finish">Kết thúc</button></aside>`;
  app.className = c.instant ? 'wide' : '';
  app.innerHTML = `<div class="bar">
      <div><strong>${esc(c.quiz.title)}</strong> <span class="muted">· Câu ${i + 1}/${n}</span></div>
      <div>${c.exam ? `<span class="muted">⏱ <span id="timer">${fmtTime(Math.round((Date.now() - c.t0) / 1000))}</span></span> · ` : ''}
        <button class="link" data-act="exit">Thoát</button></div>
    </div>
    <div class="progress"><i style="width:${(c.instant ? done : i + (c.exam || c.checked[i] ? 1 : 0)) / n * 100}%"></i></div>
    ${c.instant ? `<div class="layout">${side}<div>${main}</div></div>`
      : `${main}${c.exam ? `<div class="nav">${navBtns}</div>` : ''}`}`;
  if (focusK != null) app.querySelector(`[data-k="${focusK}"]`)?.focus();
}

// ---- results ----
function results() {
  clearInterval(timer);
  app.className = '';
  const c = S.cur, n = c.qs.length;
  const status = c.qs.map((_, i) => !c.picked[i].size ? 'skip' : isRight(i) ? 'ok' : 'bad');
  const right = status.filter(s => s === 'ok').length;
  const pct = Math.round(right / n * 100), pass = pct >= (c.quiz.pass_percent ?? 70);
  const secs = Math.round(((c.endedAt ?? Date.now()) - c.t0) / 1000);
  const sections = {};
  c.qs.forEach((q, i) => {
    if (!q.section) return;
    const s = sections[q.section] ??= { n: 0, ok: 0 };
    s.n++; s.ok += status[i] === 'ok';
  });
  const label = { all: 'Tất cả', ok: 'Đúng', bad: 'Sai', skip: 'Bỏ qua' };
  const review = c.qs.map((q, i) => ({ q, i })).filter(({ i }) => c.filter === 'all' || status[i] === c.filter)
    .map(({ q, i }) => {
      const b = { ok: ['ok', 'Đúng'], bad: ['bad', 'Sai'], skip: ['', 'Bỏ qua'] }[status[i]];
      return `<div class="card"><div class="row"><strong>Câu ${i + 1}</strong>
        <span><span class="muted">${esc(q.section)}</span> <span class="badge ${b[0]}">${b[1]}</span></span></div>
        ${questionHtml(i, true)}</div>`;
    }).join('');
  app.innerHTML = `<div class="bar"><strong>${esc(c.quiz.title)}</strong><button class="link" data-act="exit">Về danh sách</button></div>
    <div class="card score">
      <div class="pct">${pct}%</div>
      <div>${right}/${n} câu đúng · <span class="badge ${pass ? 'ok' : 'bad'}">${pass ? 'Đạt' : 'Chưa đạt'}</span></div>
      <div class="muted">Điểm đạt ${c.quiz.pass_percent ?? '?'}% · thời gian ${fmtTime(secs)}</div>
      <p><button class="btn" data-act="retake" data-id="${c.quiz.quiz_id}" ${c.instant ? 'data-instant="1"' : ''}>Làm lại</button></p>
    </div>
    ${Object.keys(sections).length ? `<h2>Theo miền kiến thức</h2><table>${Object.entries(sections).sort()
      .map(([k, s]) => `<tr><th>${esc(k)}</th><td>${s.ok}/${s.n}</td><td>${Math.round(s.ok / s.n * 100)}%</td></tr>`).join('')}</table>` : ''}
    <h2>Xem lại</h2>
    <div class="tabs">${Object.entries(label).map(([k, t]) =>
      `<button data-act="filter" data-f="${k}" class="${c.filter === k ? 'on' : ''}">${t}${k === 'all' ? '' : ` (${status.filter(s => s === k).length})`}</button>`).join('')}</div>
    ${review || '<p class="muted">Không có câu nào.</p>'}`;
}

// ---- events ----
app.addEventListener('change', e => {
  const k = e.target.dataset?.k;
  if (k == null || !S.cur) return;
  const c = S.cur, set = c.picked[c.i];
  if (e.target.type === 'radio') set.clear();
  e.target.checked ? set.add(+k) : set.delete(+k);
  // Multi-select has no "last pick", so those still use the Check button.
  if (c.instant && c.qs[c.i].correct.size === 1) c.checked[c.i] = true;
  render();
});

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const c = S.cur;
  switch (b.dataset.act) {
    case 'start': case 'retake': start(b.dataset.id, b.dataset.instant === '1'); break;
    case 'exit': if (!c || c.done || confirm('Thoát và bỏ bài đang làm?')) home(); break;
    case 'check': c.checked[c.i] = true; render(); break;
    case 'next':
      if (c.i < c.qs.length - 1) c.i++; else { c.done = true; c.endedAt = Date.now(); }
      render(); window.scrollTo(0, 0); break;
    case 'prev': c.i--; render(); window.scrollTo(0, 0); break;
    case 'go': c.i = +b.dataset.i; render(); window.scrollTo(0, 0); break;
    case 'flag': c.flagged[c.i] = !c.flagged[c.i]; render(); break;
    case 'finish': {
      const left = c.picked.filter(s => !s.size).length;
      if ((c.instant && !left) || confirm(left ? `Còn ${left} câu chưa trả lời. Nộp bài?` : 'Nộp bài?')) { c.done = true; c.endedAt = Date.now(); render(); }
      break;
    }
    case 'filter': c.filter = b.dataset.f; render(); break;
  }
});

home();
</script>
</body>
</html>
